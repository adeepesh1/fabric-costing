const costV=()=>!S.yarns.length?`<div class="empty"><h2>Add a yarn first</h2><p>Your yarn prices feed every costing.</p><button data-go="#yarns">Go to yarn prices</button></div>`:`<div class="calc"><form class="form" id="cf" onsubmit="return false">
 <fieldset><legend>Fabric</legend>${fld('fw','Finished width','inch')}<p class="hint">Needed for GSM and oz. Reed width is under Warp.</p></fieldset>
 <fieldset><legend>Warp</legend><label class="f wide"><span>Warp yarn</span><select data-k="wy">${opt(F.wy)}</select></label>${fld('epi','Ends per inch (EPI)','ends')}${fld('rs','Reed width','inch')}${fld('wc','Crimp / take-up','%')}${fld('sz','Sizing cost','₹/kg')}</fieldset>
 <fieldset><legend>Weft</legend><label class="f wide"><span>${num(F.aw)?'Weft yarn A':'Weft yarn'}</span><select data-k="fy">${opt(F.fy)}</select></label>${fld('ppi','Picks per inch (PPI)','picks')}${fld('fc','Crimp / shrinkage','%')}
 <label class="tog wide"><input type="checkbox" data-k="aw"${num(F.aw)?' checked':''}><span>Use an alternate weft yarn</span></label>
 ${num(F.aw)?`<label class="f wide"><span>Weft yarn B</span><select data-k="fy2">${opt(F.fy2)}</select></label>${fld('ra','Picks of A','in ratio')}${fld('rb','Picks of B','in ratio')}<p class="hint">Total PPI is shared between A and B in this ratio, e.g. 1 : 1 for pick-and-pick, 2 : 1 for two of A then one of B.</p>`:''}</fieldset>
 <fieldset><legend>Charges</legend>${fld('wr','Weaving rate','paise/pick')}${fld('pr','Processing','₹/m')}${fld('ot','Other overheads','₹/m')}${fld('ws','Yarn wastage','%')}${fld('pf','Profit margin','%')}</fieldset></form><aside class="res" id="res" aria-live="polite"></aside></div>`;
const res=()=>{const e=$('#res');if(!e)return;const r=calc(F),W=yarn(F.wy),Y=yarn(F.fy),Y2=yarn(F.fy2),q=S.quals.find(x=>x.id===editId);
 const rows=[['Warp yarn',r.warp,`${(r.warpKg*1000).toFixed(1)} g/m × ${inr(W?cur(W):0,0)}/kg`],[r.alt?'Weft yarn A':'Weft yarn',r.weft,`${(r.weftKg*1000).toFixed(1)} g/m × ${inr(Y?cur(Y):0,0)}/kg${r.alt?` · ${(r.shA*100).toFixed(0)}% of picks`:''}`]];
 if(r.alt)rows.push(['Weft yarn B',r.weft2,`${(r.weft2Kg*1000).toFixed(1)} g/m × ${inr(cur(Y2),0)}/kg · ${(r.shB*100).toFixed(0)}% of picks`]);
 rows.push(['Sizing',r.sizing],['Weaving',r.weaving,`${num(F.ppi)} picks × ${num(F.wr)} paise`],['Processing',r.proc],['Overheads',r.other],['Profit',r.profit,'','p']);
 const show=rows.filter(x=>x[1]>0||x[0].includes('yarn')),mx=Math.max(...show.map(x=>x[1]),0.01);
 e.innerHTML=`<p class="lbl">Cost per metre${q?' · '+esc(q.name):''}</p><p class="big">${inr(r.total)}</p><p class="sub">${inr(r.sub)} before profit${num(F.pf)?` · ${num(F.pf)}% profit`:''}</p>
 <div class="stats"><div><b>${r.gpm.toFixed(0)}</b><span>g / metre</span></div><div><b>${r.gsm?r.gsm.toFixed(0):'—'}</b><span>GSM</span></div><div><b>${r.gsm?r.oz.toFixed(2):'—'}</b><span>oz / yd²</span></div></div>
 ${r.gsm?'':'<p class="fine warnline">Enter the finished width (Fabric section) to get GSM and oz.</p>'}
 ${show.map(([l,v,s,c])=>`<div class="row ${c||''}"><span>${l}</span><span class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></span><b>${inr(v)}</b>${s?`<small>${s}</small>`:''}</div>`).join('')}
 ${q?`<p class="fine">Saved at ${inr(q.saved.cost)} on ${fd(q.saved.d)} ${chg(r.total,q.saved.cost,' since then')}</p>`:''}
 <div class="savebox"><input id="qn" placeholder="Quality name, e.g. Poplin 40×40" value="${esc(q?q.name:'')}" aria-label="Quality name"><button data-act="saveq">${q?'Update quality':'Save quality'}</button>${q?`<button class="ghost" data-act="newq">Save as new</button><button class="ghost" data-act="quoteq" data-id="${esc(q.id)}">Quote to a client</button><button class="ghost" data-act="clearedit">Start blank</button>`:''}</div>
 ${q?'':'<p class="fine">Save the quality to record client quotes for it.</p>'}
 <p class="fine">Yarn weight = length ÷ (1693.3 × Ne) for cotton counts, or denier ÷ 9,000,000 per metre for filament. Weft length per metre ≈ PPI × reed width in inches. oz = GSM ÷ 33.9.</p>`};

const sp=y=>{const h=hist(y);if(h.length<2)return `<p class="mut">Add more prices to see the trend.</p>`;const ps=h.map(x=>x.p);
 return `<div class="spark" data-id="${esc(y.id)}"><svg aria-label="Price trend"></svg></div><div class="rng"><span>${fd(h[0].d)} · ${inr(h[0].p,0)}</span><span>Low ${inr(Math.min(...ps),0)} · High ${inr(Math.max(...ps),0)}</span></div>`};
const sparks=()=>{for(const d of document.querySelectorAll('.spark')){const y=yarn(d.dataset.id),s=d.firstElementChild;if(!y)continue;
 const draw=()=>{const W=s.clientWidth,H=s.clientHeight,h=hist(y),ps=h.map(x=>x.p),lo=Math.min(...ps),hi=Math.max(...ps),t=h.map(x=>new Date(x.d).getTime()),t0=t[0],t1=t[t.length-1]||t0+1;
  const X=i=>6+(W-12)*((t[i]-t0)/((t1-t0)||1)),Yv=p=>H-8-(H-16)*((p-lo)/((hi-lo)||1));const pts=h.map((x,i)=>X(i).toFixed(1)+','+Yv(x.p).toFixed(1));
  s.innerHTML=`<polygon points="${X(0)},${H} ${pts.join(' ')} ${X(h.length-1)},${H}" fill="var(--ind2)"/><polyline points="${pts.join(' ')}" fill="none" stroke="var(--ind)" stroke-width="2.5" stroke-linejoin="round"/>${h.map((x,i)=>`<circle cx="${X(i)}" cy="${Yv(x.p)}" r="${i===h.length-1?5:3}" fill="${i===h.length-1?'var(--acc)':'var(--ind)'}"/>`).join('')}`};
 const ro=new ResizeObserver(draw);ro.observe(s)}};
const used=id=>S.quals.filter(q=>q.in.wy===id||q.in.fy===id||(num(q.in.aw)&&q.in.fy2===id)).length;
const cons=i=>{const W=yarn(i.wy),Y=yarn(i.fy),Y2=yarn(i.fy2);return `${W?cl(W):'?'} × ${Y?cl(Y):'?'}${num(i.aw)&&Y2?' + '+cl(Y2)+' ('+num(i.ra)+':'+num(i.rb)+')':''} · ${num(i.epi)}×${num(i.ppi)} · ${num(i.rs)}″`};
const yarnsV=()=>`<section class="addy"><h2>Add a yarn</h2><form id="ay" class="grid5"><label class="nm"><span>Yarn name</span><input name="name" required placeholder="e.g. Cotton combed compact"></label>
 <label><span>Count system</span><select name="sys"><option value="Ne">Ne (cotton)</option><option value="D">Denier</option><option value="tex">Tex</option></select></label>
 <label><span>Count</span><input name="count" type="number" step="any" min="0" inputmode="decimal" required placeholder="40"></label>
 <label><span>Price ₹/kg</span><input name="p" type="number" step="any" min="0" inputmode="decimal" required placeholder="300"></label>
 <label><span>Price date</span><input name="d" type="date" value="${today()}" required></label><button type="submit">Add yarn</button></form></section>
 <div class="ylist">${S.yarns.map(y=>{const h=hist(y),c=cur(y),n=used(y.id),pv=h.length>1?h[h.length-2]:null;return `<article class="yc"><div class="yh"><div><h3>${esc(y.name)}</h3><p class="mut">${esc(cl(y))} · used in ${n} ${n===1?'quality':'qualities'}</p></div>
 <div class="yp"><b>${inr(c,0)}</b><span>/kg</span>${pv?chg(c,pv.p,' since '+fd(pv.d)):''}</div></div>${sp(y)}
 <details data-id="${esc(y.id)}"${open.has(y.id)?' open':''}><summary>Price history (${h.length})</summary>
 <form class="ap" data-id="${esc(y.id)}"><input name="d" type="date" value="${today()}" required aria-label="Date"><input name="p" type="number" step="any" min="0" inputmode="decimal" placeholder="₹/kg" required aria-label="Price per kg"><button type="submit">Add price</button></form>
 <table><thead><tr><th>Date</th><th class="n">₹/kg</th><th class="n">Change</th><th></th></tr></thead><tbody>${h.slice().reverse().map((x,i,a)=>`<tr><td>${fd(x.d)}</td><td class="n">${inr(x.p,0)}</td><td class="n">${a[i+1]?chg(x.p,a[i+1].p):'—'}</td><td class="n">${h.length>1?`<button class="warn" data-act="delp" data-id="${esc(y.id)}" data-d="${esc(x.d)}" data-p="${esc(x.p)}">Remove</button>`:''}</td></tr>`).join('')}</tbody></table>
 <p style="margin:12px 0 0">${n?`<span class="mut">Used by ${n} saved ${n===1?'quality':'qualities'}, so it can't be deleted.</span>`:`<button class="warn" data-act="dely" data-id="${esc(y.id)}">Delete yarn</button>`}</p></details></article>`}).join('')||'<p class="empty">No yarns yet. Add your first yarn and its price above.</p>'}</div>`;

const qualsV=()=>!S.quals.length?`<div class="empty"><h2>No saved qualities yet</h2><p>Work out a cost, give it a name and save it. Its cost updates whenever yarn prices change.</p><button data-go="#costing">Open costing</button></div>`:`<h2>Saved qualities, priced at today's yarn rates</h2><div class="qt"><table class="stack"><thead><tr><th>Quality</th><th>Construction</th><th class="n">Saved cost</th><th class="n">Cost today</th><th class="n">Change</th><th></th></tr></thead><tbody>${S.quals.map(q=>{const r=calc(q.in),W=yarn(q.in.wy),Y=yarn(q.in.fy);
 return `<tr><td><b>${esc(q.name)}</b></td><td>${esc(cons(q.in))}</td><td class="n">${inr(q.saved.cost)} <span class="mut">${fd(q.saved.d)}</span></td><td class="n"><b>${inr(r.total)}</b></td><td class="n">${chg(r.total,q.saved.cost)||'—'}</td>
 <td><div class="acts"><button class="ghost" data-act="openq" data-id="${esc(q.id)}">Open</button><button class="ghost" data-act="quoteq" data-id="${esc(q.id)}">Quote</button><button class="ghost" data-act="rebase" data-id="${esc(q.id)}">Set today as base</button><button class="warn" data-act="delq" data-id="${esc(q.id)}">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>
 <p class="fine">“Saved cost” is the cost on the day you saved or last re-based the quality. “Cost today” uses the latest price of each yarn.</p>`;

const clients=()=>[...new Set(S.quotes.map(t=>t.client))].sort((a,b)=>a.localeCompare(b));
const qRows=()=>{const f=qFilter.toLowerCase(),list=S.quotes.filter(t=>!f||t.client.toLowerCase().includes(f)||(t.qname||'').toLowerCase().includes(f)).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
 if(!list.length)return `<tr><td colspan="7" class="empty">${S.quotes.length?'No quotes match this search.':'No quotes yet.'}</td></tr>`;
 return list.map(t=>{const q=S.quals.find(x=>x.id===t.qid),now=q?calc(q.in).total:null,m=now!=null&&t.price?(t.price-now)/t.price*100:null;
 return `<tr><td>${fd(t.d)}</td><td><b>${esc(t.client)}</b>${t.note?`<br><span class="mut">${esc(t.note)}</span>`:''}</td><td>${esc(q?q.name:t.qname)}${q?'':' <span class="mut">(deleted)</span>'}</td><td class="n"><b>${inr(t.price)}</b>/m</td><td class="n">${inr(t.cost)}</td><td class="n">${now!=null?inr(now):'—'}${m!=null?`<br><span class="${m<0?'up':'mut'}">${(Math.abs(m)<0.05?0:m).toFixed(1)}% margin now</span>`:''}</td><td><div class="acts"><button class="warn" data-act="delt" data-id="${esc(t.id)}">Delete</button></div></td></tr>`}).join('')};
const quotesV=()=>{const sel=quoteFor||(S.quals[0]||{}).id,q=S.quals.find(x=>x.id===sel),cost=q?calc(q.in).total:0,cs=clients();
 return `<section class="addy"><h2>Record a quote</h2>${!S.quals.length?'<p class="mut">Save a quality on the Costing tab first, then record what you quoted for it.</p>':`<form id="aq" class="qf">
 <label><span>Client name</span><input name="client" list="cl" required placeholder="e.g. Shree Textiles" autocomplete="off"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
 <label><span>Quality</span><select name="qid" id="aqq">${S.quals.map(x=>`<option value="${esc(x.id)}"${x.id===sel?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
 <label><span>Price quoted ₹/m</span><input name="price" type="number" step="any" min="0" inputmode="decimal" required value="${cost?cost.toFixed(2):''}"></label>
 <label><span>Date</span><input name="d" type="date" value="${today()}" required></label>
 <label class="wide"><span>Note (optional)</span><input name="note" placeholder="Quantity, payment terms, delivery…"></label>
 <button type="submit">Save quote</button></form><p class="fine" id="aqc">Cost today for this quality: ${inr(cost)} per metre. The cost is stored with the quote so you can compare later.</p>`}</section>
 <h2>Quote history</h2><div class="qtools"><input id="qs" type="search" placeholder="Search client or quality" value="${esc(qFilter)}" aria-label="Search quotes">${cs.length?`<div class="chips">${cs.slice(0,8).map(c=>`<button class="ghost" data-act="fc" data-c="${esc(c)}">${esc(c)}</button>`).join('')}${qFilter?'<button class="ghost" data-act="fc" data-c="">Show all</button>':''}</div>`:''}</div>
 <div class="qt"><table class="stack"><thead><tr><th>Date</th><th>Client</th><th>Quality</th><th class="n">Quoted</th><th class="n">Cost then</th><th class="n">Cost today</th><th></th></tr></thead><tbody id="qb">${qRows()}</tbody></table></div>
 <p class="fine">“Margin now” compares your quoted price with today's cost, so you can see which quotes need revising after yarn prices move.</p>`};
const arm=(b,key,fn)=>{if(armed===key){armed=null;fn();return}armed=key;b.dataset.arm='1';b.textContent='Tap again';setTimeout(()=>{if(armed===key){armed=null;delete b.dataset.arm;render()}},3000)};
root.addEventListener('input',e=>{const t=e.target;if(t.id==='qs'){qFilter=t.value;$('#qb').innerHTML=qRows();return}const k=t.dataset.k;if(!k||t.type==='checkbox')return;F[k]=t.value;ls.set('fc-draft',F);res()});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='aqq'){const q=S.quals.find(x=>x.id===t.value),c=q?calc(q.in).total:0;quoteFor=t.value;t.form.elements.price.value=c.toFixed(2);$('#aqc').textContent='Cost today for this quality: '+inr(c)+' per metre. The cost is stored with the quote so you can compare later.';return}
 const k=t.dataset.k;if(!k)return;if(t.type==='checkbox'){F[k]=t.checked?1:0;ls.set('fc-draft',F);render();return}F[k]=t.value;ls.set('fc-draft',F);res()});
root.addEventListener('toggle',e=>{const d=e.target;if(d.tagName!=='DETAILS')return;d.open?open.add(d.dataset.id):open.delete(d.dataset.id);ls.set('fc-open',[...open])},true);
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target,g=n=>f.elements[n].value.trim();
 if(f.id==='lf'){const pc=f.elements.pc.value,rem=f.elements.rem.checked;if(pc.length<6){loginMsg='Use at least 6 characters.';render();return}loginMsg='';hashCode(pc).then(k=>openKey(k,false,rem)).catch(()=>{loginMsg='This browser can\'t open the app here. Use the https:// link.';render()});return}
 if(f.id==='ay'){const c=num(g('count')),p=num(g('p'));if(!g('name')||!c||!p)return;const id=uid('y');S.yarns.push({id,name:g('name'),sys:g('sys'),count:c,hist:[{d:g('d')||today(),p}]});open.add(id);save();render()}
 else if(f.id==='aq'){const qid=g('qid'),q=S.quals.find(x=>x.id===qid),price=num(g('price'));if(!g('client')||!q||!price)return;const d=g('d')||today();
  S.quotes.push({id:uid('t'),client:g('client'),qid,qname:q.name,price,d,cost:calc(q.in).total,note:g('note')});quoteFor=qid;save();render();setStatus('Quote saved')}
 else if(f.classList.contains('ap')){const y=yarn(f.dataset.id),p=num(g('p')),d=g('d')||today();if(!y||!p)return;y.hist=y.hist.filter(x=>x.d!==d);y.hist.push({d,p});save();render()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){location.hash=b.dataset.go;return}const a=b.dataset.act,id=b.dataset.id;if(!a)return;
 if(a==='create'){const c=askCreate;askCreate=null;openKey(c.k,true,c.rem);return}
 if(a==='back'){askCreate=null;loginMsg='';render();return}
 if(a==='lock'){if(unsub)unsub();unsub=null;ref=null;unlocked=false;lastJson='';try{localStorage.removeItem('fc-key')}catch(e){}S=clone(SAMPLE);norm();render();return}
 if(a==='saveq'||a==='newq'){const name=($('#qn').value||'').trim()||'Untitled quality',r=calc(F),q=a==='saveq'&&S.quals.find(x=>x.id===editId),inp={};for(const k in DEF)inp[k]=k==='wy'||k==='fy'||k==='fy2'?F[k]:num(F[k]);
  if(q){q.name=name;q.in=inp;q.saved={d:today(),cost:r.total}}else{editId=uid('q');S.quals.push({id:editId,name,in:inp,saved:{d:today(),cost:r.total}})}save();render();setStatus(q?'Quality updated':'Quality saved')}
 else if(a==='clearedit'){editId=null;F=Object.assign({},DEF);ls.set('fc-edit',null);ls.set('fc-draft',F);render()}
 else if(a==='openq'){const q=S.quals.find(x=>x.id===id);if(!q)return;F=Object.assign({},DEF,q.in);editId=id;ls.set('fc-draft',F);ls.set('fc-edit',id);location.hash='#costing';render()}
 else if(a==='quoteq'){quoteFor=id;location.hash='#quotes';render()}
 else if(a==='fc'){qFilter=b.dataset.c;render()}
 else if(a==='delt')arm(b,a+id,()=>{S.quotes=S.quotes.filter(x=>x.id!==id);save();render()});
 else if(a==='rebase'){const q=S.quals.find(x=>x.id===id);if(q){q.saved={d:today(),cost:calc(q.in).total};save();render()}}
 else if(a==='delq')arm(b,a+id,()=>{S.quals=S.quals.filter(x=>x.id!==id);if(editId===id)editId=null;save();render()});
 else if(a==='dely')arm(b,a+id,()=>{S.yarns=S.yarns.filter(x=>x.id!==id);save();render()});
 else if(a==='delp'){const y=yarn(id);arm(b,a+id+b.dataset.d,()=>{y.hist=y.hist.filter(x=>!(x.d===b.dataset.d&&String(x.p)===b.dataset.p));save();render()})}
 else if(a==='clear')arm(b,a,()=>{S={v:1,yarns:[],quals:[],quotes:[]};editId=null;F=Object.assign({},DEF);location.hash='#yarns';save();render()})});
window.addEventListener('hashchange',render);
new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(root,{childList:true,subtree:true});
render();
function openKey(k,create,rem){if(unsub)unsub();unsub=null;ref=fs.collection('fabricShared').doc(k);lastJson='';ready=false;unlocked=true;render();
 unsub=ref.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;
  if(!snap.exists){if(snap.metadata.fromCache)return;if(!create){unsub();unsub=null;ref=null;unlocked=false;ready=true;askCreate={k,rem};render();return}
   if(rem)ls.set('fc-key',k);create=false;S=clone(SAMPLE);norm();ready=true;render();save();return}
  if(rem)ls.set('fc-key',k);const j=snap.data().json;if(ready&&j===lastJson)return;lastJson=j;try{S=JSON.parse(j)}catch(e){}norm();ready=true;status='All changes saved';render()},
  x=>{if(unsub)unsub();unsub=null;ref=null;unlocked=false;ready=true;loginMsg='Could not open: '+(x.code==='permission-denied'?'the database rules are blocking access. Check the Firestore rules.':(x.code||x.message));render()})}
if(!CONFIGURED){const l=ls.get('fc-data');if(l&&Array.isArray(l.yarns)){S=l;norm()}setStatus('Firebase not set up yet: saving on this device only');render()}
else{firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 openKey('shared',true,false);}
}
